<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Recommend a figure</title>
  <script>
    // Use a full navigation so GitHub's in-page issue creator cannot skip the template.
    window.location.replace('https://github.com/Chutj/sci-figure-gallery/issues/new?template=figure-suggestion.yml');
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 38rem; margin: 12vh auto; padding: 0 1.5rem; line-height: 1.6; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>Recommend a figure</h1>
  <p><a href="https://github.com/Chutj/sci-figure-gallery/issues/new?template=figure-suggestion.yml">Open the figure recommendation form on GitHub</a></p>
  <p>If the form does not load, <a href="https://github.com/Chutj/sci-figure-gallery/issues/new/choose">choose “Suggest a scientific figure” on GitHub</a>.</p>
</body>
</html>
