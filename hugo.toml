baseURL = 'https://chutj.github.io/'
locale = 'en'
defaultContentLanguage = 'en'
title = 'My Academic Website'
theme = 'PaperMod'
hasCJKLanguage = false
buildDrafts = false

[params]
mainSections = ['posts']
description = 'A personal space for academic exploration, scientific visualization, and sharing useful research resources.'
defaultTheme = 'auto'

# Public beacon identifier only. The private API credential belongs in Secrets.
[params.webAnalytics]
enabled = false
beaconToken = ''

[params.label]
icon = '/site-branding/site-logo.png'
iconHeight = 30

[params.assets]
favicon = '/site-branding/favicon.ico?v=square-20261025'
favicon16x16 = '/site-branding/favicon-16x16.png?v=square-20261025'
favicon32x32 = '/site-branding/favicon-32x32.png?v=square-20261025'
apple_touch_icon = '/site-branding/apple-touch-icon.png?v=square-20261025'

[params.profileMode]
enabled = true
title = 'Welcome to My Academic Website'
subtitle = 'A personal space for academic exploration, scientific visualization, and sharing useful research resources. Personal introduction and research interests will be added here.'

[[params.profileMode.buttons]]
name = 'Explore Figure Gallery'
url = '/gallery/'

[[menus.main]]
identifier = 'home'
name = 'Home'
url = '/'
weight = 10

[[menus.main]]
identifier = 'gallery'
name = 'Figure Gallery'
url = '/gallery/'
weight = 20

[[menus.main]]
identifier = 'gee-access'
name = 'GEE Access'
url = '/gee-access/'
weight = 30
